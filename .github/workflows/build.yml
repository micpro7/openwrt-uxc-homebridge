name: Build Homebridge UXC Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        default: "latest"
        required: false
      config_ui_version:
        default: "latest"
        required: false

  schedule:
    - cron: "0 6 * * 1"

  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # ==========================================================
      # STEP 1: Build image and export raw rootfs tarball
      # ==========================================================
      - name: Build rootfs (Docker)
        run: |
          set -eux

          # 1. Build local container image
          docker buildx build \
            --platform linux/arm64 \
            --tag homebridge-uxc:build \
            --build-arg HOMEBRIDGE_VERSION="${{ inputs.homebridge_version || 'latest' }}" \
            --build-arg CONFIG_UI_VERSION="${{ inputs.config_ui_version || 'latest' }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

          # 2. Export raw filesystem tarball using container export
          CONTAINER_ID=$(docker create homebridge-uxc:build)
          docker export "$CONTAINER_ID" > rootfs.tar
          docker rm "$CONTAINER_ID"

      # ==========================================================
      # STEP 2: Assemble OCI bundle
      # ==========================================================
      - name: Assemble bundle
        run: |
          set -eux

          mkdir -p bundle/rootfs

          # Extract image filesystem forcing root (0:0) and preserving permissions
          tar -xpf rootfs.tar -C bundle/rootfs --owner=0 --group=0 --numeric-owner --same-permissions
          rm -f rootfs.tar

          # Strip unnecessary files
          rm -rf bundle/rootfs/usr/share/man \
                 bundle/rootfs/usr/share/doc \
                 bundle/rootfs/var/cache/apk/* \
                 bundle/rootfs/tmp/*

          # Copy config
          cp ./config.json bundle/config.json

          # Validate config syntax and required OCI fields
          python3 -m json.tool bundle/config.json > /dev/null
          python3 - <<'PY'
          import json
          c = json.load(open("bundle/config.json"))
          required = ["ociVersion", "process", "root", "mounts"]
          for k in required:
              assert k in c, f"Missing OCI field: {k}"
          print("OCI config OK")
          PY

          # DEBUG: Verify Node location
          find bundle/rootfs -name node

          # Validate runtime and core binaries exist (Node is installed via apk to /usr/bin/node)
          test -x bundle/rootfs/usr/bin/node
          test -x bundle/rootfs/usr/local/bin/homebridge
          test -x bundle/rootfs/usr/local/bin/hb-service
          test -d bundle/rootfs/usr/local/lib/node_modules/homebridge
          test -d bundle/rootfs/usr/local/lib/node_modules/homebridge-config-ui-x

          # Explicitly ensure setuid bit on sudo before packaging
          chmod 4755 bundle/rootfs/usr/bin/sudo 2>/dev/null || true

          # Create final bundle with strict root ownership & preserved permissions
          tar \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            --same-permissions \
            -czf homebridge-arm64.tar.gz \
            -C bundle .

      # ==========================================================
      # STEP 3: Minimal sanity check & contents review
      # ==========================================================
      - name: Sanity check bundle
        run: |
          set -eux

          tar -tzf homebridge-arm64.tar.gz | grep -q config.json
          tar -tzf homebridge-arm64.tar.gz | grep -q "rootfs/usr/bin/node"

          echo "Bundle contents preview:"
          tar -tzf homebridge-arm64.tar.gz | sed -n '1,50p'

          echo "Bundle size:"
          du -sh homebridge-arm64.tar.gz

      # ==========================================================
      # STEP 4: Extract Metadata & Build Release
      # ==========================================================
      - name: Extract Versions & Metadata
        run: |
          set -eux
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # 1. Parse Alpine Release Version
          ALPINE_VER=$(cat bundle/rootfs/etc/alpine-release)
          
          # 2. Parse Node Version from installed apk database
          NODE_VER=$(grep -A1 "P:nodejs" bundle/rootfs/lib/apk/db/installed | grep "V:" | cut -d: -f2)
          
          # 3. Parse Homebridge Version from package.json
          HB_VER=$(python3 -c "import json; print(json.load(open('bundle/rootfs/usr/local/lib/node_modules/homebridge/package.json'))['version'])")
          
          # 4. Parse Homebridge Config UI X Version from package.json
          UI_VER=$(python3 -c "import json; print(json.load(open('bundle/rootfs/usr/local/lib/node_modules/homebridge-config-ui-x/package.json'))['version'])")
          
          # Export to environment variables
          echo "ALPINE_VER=${ALPINE_VER}" >> $GITHUB_ENV
          echo "NODE_VER=${NODE_VER}" >> $GITHUB_ENV
          echo "HB_VER=${HB_VER}" >> $GITHUB_ENV
          echo "UI_VER=${UI_VER}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Homebridge v${HB_VER} (${CURRENT_DATE})" >> $GITHUB_ENV
          echo "BUILD_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

          # Output summary to GitHub UI
          echo "### Build Versions 📦" >> $GITHUB_STEP_SUMMARY
          echo "- **Alpine Linux:** ${ALPINE_VER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js:** ${NODE_VER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Homebridge:** ${HB_VER}" >> $GITHUB_STEP_SUMMARY
          echo "- **Config UI X:** ${UI_VER}" >> $GITHUB_STEP_SUMMARY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: latest
          make_latest: true
          fail_on_unmatched_files: true
          files: homebridge-arm64.tar.gz
          body: |
            ### 🚀 Homebridge UXC OCI Bundle (Stable Release)

            **Component Release Manifest:**
            * **Alpine Linux:** `${{ env.ALPINE_VER }}`
            * **Node.js:** `${{ env.NODE_VER }}`
            * **Homebridge:** `v${{ env.HB_VER }}`
            * **Homebridge UI:** `v${{ env.UI_VER }}`

            -----------------------------
            BUILD METADATA
            -----------------------------
            - **Commit SHA:** `${{ env.BUILD_SHA }}`
            - **Target Arch:** `linux/arm64`
            - **Export Format:** Native OCI rootfs bundle for OpenWrt UXC
