name: Build Homebridge UXC Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        default: "latest"
        required: false
      config_ui_version:
        default: "latest"
        required: false

  schedule:
    - cron: "0 6 * * 1"

  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config.json"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================================
      # STEP 1: Build container rootfs (ALL software installed here)
      # ==========================================================
      - name: Build rootfs (Docker)
        run: |
          set -eux

          HB_VER="${{ inputs.homebridge_version }}"
          UI_VER="${{ inputs.config_ui_version }}"

          docker buildx build \
            --build-arg HOMEBRIDGE_VERSION="${HB_VER:-latest}" \
            --build-arg CONFIG_UI_VERSION="${UI_VER:-latest}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=tar,dest=rootfs.tar \
            .

      # ==========================================================
      # STEP 2: Assemble OCI bundle (Strict Root Execution UID 0)
      # ==========================================================
      - name: Assemble bundle
        run: |
          set -eux

          mkdir -p bundle/rootfs

          # Extract image filesystem preserving permissions
          sudo tar -xpf rootfs.tar -C bundle/rootfs
          rm -f rootfs.tar

          # Strip unnecessary files to minimize UXC footprint
          sudo rm -rf bundle/rootfs/usr/share/man \
                      bundle/rootfs/usr/share/doc \
                      bundle/rootfs/var/cache/apk/* \
                      bundle/rootfs/tmp/*

          # Copy config
          cp ./config.json bundle/config.json

          # Validate config
          python3 -m json.tool bundle/config.json > /dev/null

          # Validate runtime exists
          sudo test -x bundle/rootfs/usr/local/bin/node

          # Create final bundle
          cd bundle
          sudo tar -czf ../homebridge-arm64.tar.gz config.json rootfs
          cd ..

          # Reclaim ownership
          sudo chown $(id -u):$(id -g) homebridge-arm64.tar.gz

      # ==========================================================
      # STEP 3: Minimal sanity check
      # ==========================================================
      - name: Sanity check bundle
        run: |
          set -eux

          tar -tzf homebridge-arm64.tar.gz | grep -q config.json
          tar -tzf homebridge-arm64.tar.gz | grep -q "rootfs/usr/local/bin/node"

          echo "Bundle size:"
          du -sh homebridge-arm64.tar.gz

      # ==========================================================
      # STEP 4: Release Metadata Generation
      # ==========================================================
      - name: Determine Release Name and Details
        run: |
          set -eux
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # Extract Homebridge version directly from rootfs
          if [ -f "bundle/rootfs/usr/local/lib/node_modules/homebridge/package.json" ]; then
            HB_VERSION=$(grep -m 1 '"version"' bundle/rootfs/usr/local/lib/node_modules/homebridge/package.json | awk -F'"' '{print $4}')
          else
            HB_VERSION="${{ inputs.homebridge_version || 'latest' }}"
          fi

          # Read Node & NPM version directly from package manifests or system files inside bundle
          NODE_VERSION=$(grep -m 1 '"NODE_VERSION"' bundle/rootfs/etc/profile.d/* 2>/dev/null | cut -d'=' -f2 || echo "Unknown")
          
          # Calculate exact compressed bundle size
          BUNDLE_SIZE=$(du -sh homebridge-arm64.tar.gz | cut -f1)

          # Export metrics directly to GITHUB_ENV
          echo "TAG_NAME=v${HB_VERSION}-${CURRENT_DATE}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Homebridge v${HB_VERSION} (${CURRENT_DATE})" >> $GITHUB_ENV
          echo "HB_VERSION=${HB_VERSION}" >> $GITHUB_ENV
          echo "BUNDLE_SIZE=${BUNDLE_SIZE}" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          make_latest: true
          files: homebridge-arm64.tar.gz
          body: |
            ### 📦 Release Asset Details
            * **Release Version:** `Homebridge v${{ env.HB_VERSION }}`
            * **Compiled Asset Size:** `${{ env.BUNDLE_SIZE }}` (Uncompressed filesystem-based OCI export)
            * **Target Architecture:** `ARM64 (aarch64)`
            * **Base Environment:** `Alpine 3.22`

            ---

            ### ⚙️ Design Notes
            - Homebridge is installed inside Docker image only
            - Configured to run cleanly as root (UID 0) to support native OpenWrt UXC micro-container isolation
            - Configured with `NODE_OPTIONS="--max-old-space-size=128"` to prevent OOM termination on low-RAM hardware
            - Bundle is purely filesystem-based OCI export with preserved permissions

            ---

            ### 🛠️ Build Info
            - **Base:** Alpine 3.22 (arm64)
            - **Build System:** Native `ubuntu-24.04-arm` runner utilizing Docker Buildx Cache
