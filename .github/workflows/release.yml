name: Build Homebridge UXC Bundle

on:
  workflow_dispatch:
    inputs:
      homebridge_version:
        default: "latest"
        required: false
      config_ui_version:
        default: "latest"
        required: false

  schedule:
    - cron: "0 6 * * 1"

  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "config.json"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # ==========================================================
      # STEP 1: Build container rootfs (ALL software installed here)
      # ==========================================================
      - name: Build rootfs (Docker)
        run: |
          set -eux

          docker buildx build \
            --build-arg HOMEBRIDGE_VERSION="${{ inputs.homebridge_version || 'latest' }}" \
            --build-arg CONFIG_UI_VERSION="${{ inputs.config_ui_version || 'latest' }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=tar,dest=rootfs.tar \
            .

      # ==========================================================
      # STEP 2: Assemble OCI bundle
      # ==========================================================
      - name: Assemble bundle
        run: |
          set -eux

          mkdir -p bundle/rootfs

          # Extract image filesystem (using -p to preserve permissions and ownership)
          sudo tar -xpf rootfs.tar -C bundle/rootfs
          rm -f rootfs.tar

          # Strip unnecessary files to minimize UXC footprint
          sudo rm -rf bundle/rootfs/usr/share/man \
                      bundle/rootfs/usr/share/doc \
                      bundle/rootfs/var/cache/apk/* \
                      bundle/rootfs/tmp/*

          # Copy config
          cp ./config.json bundle/config.json

          # Validate config
          python3 -m json.tool bundle/config.json > /dev/null

          # DEBUG: Verify Node location (using sudo to avoid permission denied crashes)
          sudo find bundle/rootfs -name node

          # Validate runtime exists at /usr/local/bin/node (using sudo to read root-owned directories)
          sudo test -x bundle/rootfs/usr/local/bin/node

          # Create final bundle (Preserving original non-root user UID/GID 10001)
          sudo tar -czf homebridge-arm64.tar.gz -C bundle .

          # Reclaim ownership of the output archive so runner can publish it
          sudo chown $(id -u):$(id -g) homebridge-arm64.tar.gz

      # ==========================================================
      # STEP 3: Minimal sanity check
      # ==========================================================
      - name: Sanity check bundle
        run: |
          set -eux

          tar -tzf homebridge-arm64.tar.gz | grep -q config.json
          tar -tzf homebridge-arm64.tar.gz | grep -q "rootfs/usr/local/bin/node"

          echo "Bundle size:"
          du -sh homebridge-arm64.tar.gz

      # ==========================================================
      # STEP 4: Release
      # ==========================================================
      - name: Determine Release Name and Details
        run: |
          set -eux
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # Extract Homebridge version from the uncompressed bundle
          if [ -f "bundle/rootfs/usr/local/lib/node_modules/homebridge/package.json" ]; then
            HB_VERSION=$(grep -m 1 '"version"' bundle/rootfs/usr/local/lib/node_modules/homebridge/package.json | awk -F'"' '{print $4}')
          else
            HB_VERSION="${{ inputs.homebridge_version || 'latest' }}"
          fi

          # Extract exact Node and NPM versions from rootfs
          NODE_VERSION=$(sudo bundle/rootfs/usr/local/bin/node --version | tr -d 'v')
          NPM_VERSION=$(sudo bundle/rootfs/usr/local/bin/node -e "console.log(require('child_process').execSync('npm --version').toString().trim())")
          
          # Calculate exact compressed bundle size
          BUNDLE_SIZE=$(du -sh homebridge-arm64.tar.gz | cut -f1)

          # Export metrics directly to GITHUB_ENV for the release body
          echo "RELEASE_NAME=Homebridge V${HB_VERSION}-${CURRENT_DATE}" >> $GITHUB_ENV
          echo "HB_VERSION=${HB_VERSION}" >> $GITHUB_ENV
          echo "NODE_VERSION=${NODE_VERSION}" >> $GITHUB_ENV
          echo "NPM_VERSION=${NPM_VERSION}" >> $GITHUB_ENV
          echo "BUNDLE_SIZE=${BUNDLE_SIZE}" >> $GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: latest
          make_latest: true
          files: homebridge-arm64.tar.gz
          body: |
            ### 📦 Release Asset Details
            * **Release Version:** `Homebridge v${{ env.HB_VERSION }}`
            * **Compiled Asset Size:** `${{ env.BUNDLE_SIZE }}` (Uncompressed filesystem-based OCI export)
            * **Target Architecture:** `ARM64 (aarch64)`
            * **Base Environment:** `Alpine 3.22` running `Node.js v${{ env.NODE_VERSION }}` and `NPM v${{ env.NPM_VERSION }}`

            ---

            ### ⚙️ Design Notes
            - Homebridge is installed inside Docker image only
            - Configured to run securely as a non-root user (UID/GID 10001)
            - Setup directories are pre-owned by the low-privilege 'homebridge' user
            - Sudo environment variables are preserved for NPM configuration stability
            - Configured with `NODE_OPTIONS="--max-old-space-size=256"` to prevent OOM termination on devices running under strict constraints (e.g 1GB RAM)
            - No dependency inspection is done on GitHub runner
            - Bundle is purely filesystem-based OCI export with preserved permissions

            ---

            ### 🛠️ Build Info
            - **Base:** Alpine 3.22 (arm64)
            - **Build System:** Native `ubuntu-24.04-arm` runner utilizing Docker Buildx Cache
